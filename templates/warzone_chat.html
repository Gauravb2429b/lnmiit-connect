<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Warzone — Live Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#0b0b0f; --bg-card:#13131c; --bg-input:#1a1a24; --bg-hover:#1e1e2a;
      --border:rgba(255,255,255,0.07); --accent:#6366f1;
      --text-1:#eeeef5; --text-2:#8888a8; --text-3:#44445a;
      --red:#f87171; --green:#34d399;
      --wz:#ff4444; --wz-soft:rgba(255,68,68,0.12);
      --r:14px;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg); color:var(--text-1);
      font-family:'DM Sans', sans-serif; -webkit-font-smoothing:antialiased;
      display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    }

    /* NAV */
    .nav {
      flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px;
      background:rgba(11,11,15,0.95); border-bottom:1px solid var(--border);
      z-index:10;
    }
    .nav-left { display:flex; align-items:center; gap:10px; }
    .back-btn {
      width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
      background:transparent; color:var(--text-2); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:16px;
      text-decoration:none; transition:all 0.2s;
    }
    .back-btn:hover { background:var(--bg-hover); color:var(--text-1); }
    .nav-title { font-size:15px; font-weight:600; }
    .nav-sub   { font-size:11px; color:var(--text-3); margin-top:1px; font-family:'Space Mono',monospace; }
    .live-pill {
      display:flex; align-items:center; gap:5px;
      font-size:11px; padding:3px 10px; border-radius:20px;
      background:var(--wz-soft); color:var(--wz);
      border:1px solid rgba(255,68,68,0.2);
    }
    .pulse { width:6px; height:6px; border-radius:50%; background:var(--wz); animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.4)} }

    /* MESSAGES */
    .messages {
      flex:1; overflow-y:auto; padding:16px 12px;
      display:flex; flex-direction:column; gap:2px;
      scroll-behavior:smooth;
    }
    .messages::-webkit-scrollbar { width:4px; }
    .messages::-webkit-scrollbar-track { background:transparent; }
    .messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    .msg {
      display:flex; gap:10px; padding:6px 8px; border-radius:10px;
      transition:background 0.15s; max-width:100%;
    }
    .msg:hover { background:var(--bg-hover); }
    .msg.own { flex-direction:row-reverse; }

    .msg-avatar {
      width:30px; height:30px; border-radius:9px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; margin-top:2px;
    }
    .msg-body { flex:1; min-width:0; }
    .msg.own .msg-body { text-align:right; }

    .msg-header {
      display:flex; align-items:baseline; gap:8px; margin-bottom:3px; flex-wrap:wrap;
    }
    .msg.own .msg-header { flex-direction:row-reverse; }

    .msg-name {
      font-size:12px; font-weight:600; font-family:'Space Mono',monospace;
    }
    .msg-time { font-size:10px; color:var(--text-3); }
    .msg-text {
      font-size:14px; line-height:1.5; word-break:break-word;
      color:var(--text-1);
    }

    .msg-bubble {
      display:inline-block; background:var(--bg-card);
      border:1px solid var(--border); border-radius:12px;
      padding:8px 12px; font-size:14px; line-height:1.5;
      word-break:break-word; max-width:320px; text-align:left;
    }
    .msg.own .msg-bubble {
      background:rgba(99,102,241,0.12); border-color:rgba(99,102,241,0.25);
    }

    /* system messages */
    .sys-msg {
      text-align:center; font-size:11px; color:var(--text-3);
      padding:8px 0; font-family:'Space Mono',monospace;
    }

    /* date divider */
    .date-div {
      display:flex; align-items:center; gap:10px;
      font-size:10px; color:var(--text-3); padding:10px 0;
      font-family:'Space Mono',monospace; letter-spacing:0.05em;
    }
    .date-div::before, .date-div::after {
      content:''; flex:1; height:1px; background:var(--border);
    }

    /* INPUT BAR */
    .input-bar {
      flex-shrink:0;
      padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom));
      background:rgba(11,11,15,0.95); border-top:1px solid var(--border);
      display:flex; gap:10px; align-items:flex-end;
    }
    .input-wrap { flex:1; position:relative; }
    .msg-input {
      width:100%; background:var(--bg-input); border:1px solid var(--border);
      color:var(--text-1); border-radius:12px;
      padding:10px 14px; font-size:14px; font-family:'DM Sans',sans-serif;
      outline:none; resize:none; max-height:120px; min-height:44px;
      transition:border-color 0.2s; line-height:1.4;
    }
    .msg-input::placeholder { color:var(--text-3); }
    .msg-input:focus { border-color:rgba(255,68,68,0.35); }

    .send-btn {
      width:44px; height:44px; border-radius:12px; flex-shrink:0;
      background:var(--wz); border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; transition:all 0.2s;
    }
    .send-btn:hover { background:#ff2222; transform:scale(1.05); }
    .send-btn:disabled { background:var(--bg-hover); cursor:not-allowed; opacity:0.5; transform:none; }

    /* char count */
    .char-count {
      font-size:10px; color:var(--text-3); text-align:right;
      padding:2px 4px 0; font-family:'Space Mono',monospace;
    }
    .char-count.warn { color:var(--red); }

    .empty-chat {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      color:var(--text-3); gap:10px;
    }
    .empty-icon { font-size:40px; }
    .empty-text { font-size:14px; }

    /* rules banner */
    .rules-banner {
      margin:12px; background:rgba(99,102,241,0.06);
      border:1px solid rgba(99,102,241,0.15); border-radius:12px;
      padding:10px 14px; font-size:12px; color:var(--text-2); line-height:1.6;
    }
    .rules-banner strong { color:var(--text-1); }
    .rules-close {
      float:right; cursor:pointer; color:var(--text-3); font-size:16px;
      line-height:1; margin-left:8px;
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-left">
    <a href="warzone.html" class="back-btn">←</a>
    <div>
      <div class="nav-title">⚡ Warzone Chat</div>
      <div class="nav-sub" id="onlineCount">connecting...</div>
    </div>
  </div>
  <div class="live-pill">
    <div class="pulse"></div>
    LIVE
  </div>
</nav>

<div class="rules-banner" id="rulesBanner">
  <span class="rules-close" onclick="document.getElementById('rulesBanner').style.display='none'">×</span>
  <strong>Warzone rules:</strong> You're anonymous here. No slurs, no personal attacks, no sharing private info. Messages auto-delete after 12 hours. 🔥
</div>

<div class="messages" id="messages">
  <div class="empty-chat" id="emptyState">
    <div class="empty-icon">💬</div>
    <div class="empty-text">Be the first to say something...</div>
  </div>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea
      class="msg-input" id="msgInput"
      placeholder="Say something anonymous..."
      rows="1" maxlength="500"
      onkeydown="handleKey(event)"
      oninput="handleInput(this)"
    ></textarea>
    <div class="char-count" id="charCount">0 / 500</div>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
</div>

<script>
  let myAnonName = '';
  let myUserId   = null;
  let isAdmin    = false;
  let lastMsgId  = 0;
  let pollTimer  = null;
  const YEAR_COLORS = ['', '#34d399', '#fbbf24', '#f87171', '#eeeef5'];

  function colorFor(m) {
    return YEAR_COLORS[m.year] || '#a5b4fc';
  }

  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60)  return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    return Math.floor(diff/3600) + 'h ago';
  }

  function formatTime(iso) {
    // Database stores UTC, convert to IST (+5:30)
    const d = new Date(iso.replace(' ', 'T') + 'Z');
    return d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata'});
  }

  async function init() {
    try {
      const r = await fetch('/api/me', { credentials:'include' });
      const d = await r.json();
      if (d.error) { window.location.href = 'index.html'; return; }
      myAnonName = d.anon_username || d.name;
      myUserId   = d.id;
      isAdmin    = d.role === 'admin';
      startPolling();
    } catch(e) {
      console.error(e);
    }
  }

  function startPolling() {
    fetchMessages();
    pollTimer = setInterval(fetchMessages, 2000);
  }

  async function fetchMessages() {
    try {
      const r = await fetch(`/api/warzone/chat?after=${lastMsgId}`, { credentials:'include' });
      const msgs = await r.json();
      if (!Array.isArray(msgs)) return;

      if (msgs.length > 0) {
        const container = document.getElementById('messages');
        const empty = document.getElementById('emptyState');
        if (empty) empty.remove();

        const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

        msgs.forEach(m => {
          if (m.id > lastMsgId) lastMsgId = m.id;
          appendMessage(m);
        });

        if (wasAtBottom) container.scrollTop = container.scrollHeight;
      }

      // update online count
      const stats = await fetch('/api/warzone/stats', { credentials:'include' }).then(r=>r.json()).catch(()=>({}));
      if (stats.live_users !== undefined) {
        document.getElementById('onlineCount').textContent = stats.live_users + ' online';
      }
    } catch(e) {}
  }

  function appendMessage(m) {
    const container = document.getElementById('messages');
    const isOwn = m.anon_username === myAnonName;
    const color = colorFor(m);

    const div = document.createElement('div');
    div.className = 'msg' + (isOwn ? ' own' : '');
    div.id = 'msg-' + m.id;

    div.innerHTML = `
      <div class="msg-avatar" style="background:${color}22;color:${color};border:1px solid ${color}33">
        ${m.anon_username.charAt(0).toUpperCase()}
      </div>
      <div class="msg-body">
        <div class="msg-header">
          <span class="msg-name" style="color:${color}">@${m.anon_username}</span>
          <span class="msg-time">${formatTime(m.created_at)}</span>
          ${isAdmin ? `<span onclick="deleteMsg(${m.id})" style="cursor:pointer;color:#f87171;font-size:11px;margin-left:4px;">🗑</span>` : ''}
        </div>
        <div class="msg-bubble">${escHtml(m.message)}</div>
      </div>`;

    container.appendChild(div);
  }

  async function deleteMsg(msgId) {
    if (!confirm('Delete this message?')) return;
    const r = await fetch(`/api/warzone/chat/${msgId}/delete`, { method:'POST', credentials:'include' });
    const d = await r.json();
    if (d.message) {
      const el = document.getElementById('msg-' + msgId);
      if (el) el.remove();
    }
  }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text  = input.value.trim();
    if (!text) return;

    document.getElementById('sendBtn').disabled = true;

    try {
      const r = await fetch('/api/warzone/chat', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text })
      });
      const d = await r.json();
      if (d.error) { alert(d.error); return; }

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('charCount').textContent = '0 / 500';
      await fetchMessages();
    } catch(e) {
      alert('Failed to send. Try again.');
    } finally {
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function handleInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    const len = el.value.length;
    const cc  = document.getElementById('charCount');
    cc.textContent = len + ' / 500';
    cc.className = 'char-count' + (len > 450 ? ' warn' : '');
    document.getElementById('sendBtn').disabled = el.value.trim().length === 0;
  }

  init();
</script>
</body>
</html>
